[project]
name = "generator"
version = "0.1.0"
description = "Synthetic procurement data and exception generator"
readme = "README.md"
authors = [
    { name = "Sai Aryan Nampally", email = "voyageuraryan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "erp-domain",
    "pydantic",
    "pyyaml",
]

[project.scripts]
generator = "generator.cli:main"

[tool.uv.sources]
erp-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
