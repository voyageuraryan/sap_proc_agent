[project]
name = "sap_proc_agent"
version = "0.1.0"
description = "SAP procurement exception agent with human-gated writes"
readme = "README.md"
authors = [
    { name = "Sai Aryan Nampally", email = "voyageuraryan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/mock_erp",
    "packages/generator",
    "packages/erp_domain",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Path() in a parameter default is FastAPI's intended
# API, not the mutable-default bug B008 exists to catch. Silenced
# deliberately rather than restructuring working framework code.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["packages"]
