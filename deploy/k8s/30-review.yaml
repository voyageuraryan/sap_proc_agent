# Stateless: it holds nothing, it is a client of the ERP. So a Deployment, and
# it can scale horizontally -- the approval state lives in the ERP where the
# state machine can guard it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review
  namespace: proc-agent
  labels: { app.kubernetes.io/name: review, app.kubernetes.io/part-of: sap-proc-agent }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: review }
  template:
    metadata:
      labels: { app.kubernetes.io/name: review }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: review
          image: sap-proc-agent:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "review_ui.app:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{ name: http, containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: proc-agent-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          # /healthz here reports whether the ERP is REACHABLE, not merely
          # whether the process booted -- so a review pod with no path to the
          # ERP is taken out of service instead of serving broken pages.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: review
  namespace: proc-agent
spec:
  selector: { app.kubernetes.io/name: review }
  ports: [{ name: http, port: 8001, targetPort: http }]
